apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    delete: "true"
    stage: dev
  name: worker
  namespace: team-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  strategy: {}
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccount: worker
      containers:
      - image: localhost:32000/worker:dev
        imagePullPolicy: Always
        name: worker
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        command:
        - sleep
        - "3600"
        resources: {}
status: {}
